# Desarrollo local. Gotenberg no se expone fuera de localhost (S10).
services:
  gotenberg:
    build: ./gotenberg
    image: conexiones-gotenberg:dev
    # Las banderas de seguridad (S10) están en el CMD de gotenberg/Dockerfile.
    environment:
      GOTENBERG_API_BASIC_AUTH_USERNAME: ${GOTENBERG_USER:-dev}
      GOTENBERG_API_BASIC_AUTH_PASSWORD: ${GOTENBERG_PASSWORD:?Definir GOTENBERG_PASSWORD en .env}
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
