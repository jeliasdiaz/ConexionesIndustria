# Producción: migraciones y login (Supabase), variables y redespliegue (Vercel)
# y pruebas de humo. Manual: Actions → Producción → Run workflow.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN, SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, RESEND_API_KEY,
#   GOTENBERG_URL, GOTENBERG_PASSWORD, y (antes del piloto) TURNSTILE_SITEKEY
#   y TURNSTILE_SECRET. Variable opcional: MAIL_FROM_ADDRESS (hasta tener
#   dominio verificado, H6, es onboarding@resend.dev).
# Cada secreto llega solo al paso que lo usa; nunca a `npm ci`, donde correría
# el código de instalación de las dependencias.
name: Producción

on:
  workflow_dispatch:
    inputs:
      solo_pruebas:
        description: Solo las pruebas de humo (no toca Supabase ni Vercel)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: produccion
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: vovtqhdgmhfefsijxjhf
  VERCEL_PROJECT: conexiones-industria
  VERCEL_TEAM_SLUG: jose-diazs-projects
  APP_URL: https://conexiones-industria.vercel.app
  MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS || 'onboarding@resend.dev' }}

jobs:
  produccion:
    name: Supabase, Vercel y pruebas de humo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Secretos presentes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOTENBERG_URL: ${{ secrets.GOTENBERG_URL }}
          GOTENBERG_PASSWORD: ${{ secrets.GOTENBERG_PASSWORD }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          missing=""
          for k in VERCEL_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD RESEND_API_KEY GOTENBERG_URL GOTENBERG_PASSWORD; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos del repositorio:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          [ -n "$TURNSTILE_SECRET" ] || echo "::warning::Sin TURNSTILE_SECRET: producción usará las claves de prueba de Cloudflare (sin protección anti-bots)."

      - name: Supabase · migraciones
        if: ${{ !inputs.solo_pruebas }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase db push --dry-run
          npx supabase db push --yes

      - name: Supabase · login de admin (SMTP de Resend, plantilla, límites)
        if: ${{ !inputs.solo_pruebas }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npx supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Vercel · variables de producción
        if: ${{ !inputs.solo_pruebas }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOTENBERG_URL: ${{ secrets.GOTENBERG_URL }}
          GOTENBERG_PASSWORD: ${{ secrets.GOTENBERG_PASSWORD }}
          TURNSTILE_SITEKEY: ${{ secrets.TURNSTILE_SITEKEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: npx tsx scripts/deploy/vercel.ts env

      # Conservación: pg_cron llama cada minuto a la app para borrar lo vencido.
      # La clave se genera en la BD, queda en Vault y se copia a Vercel
      # (CRON_SECRET); la activa el redespliegue de abajo.
      - name: Supabase y Vercel · reloj de conservación
        if: ${{ !inputs.solo_pruebas }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx tsx scripts/deploy/purge.ts

      # NEXT_PUBLIC_* se incrusta al compilar: sin redespliegue no toma efecto.
      - name: Vercel · redesplegar producción
        if: ${{ !inputs.solo_pruebas }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx tsx scripts/deploy/vercel.ts redeploy

      - name: Pruebas de humo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOTENBERG_URL: ${{ secrets.GOTENBERG_URL }}
          GOTENBERG_PASSWORD: ${{ secrets.GOTENBERG_PASSWORD }}
        run: npx tsx --conditions=react-server scripts/deploy/smoke.ts
